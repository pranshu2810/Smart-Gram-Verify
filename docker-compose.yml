version: '3.8'

services:
  # ── MongoDB ──
  mongodb:
    image: mongo:7
    container_name: smartgram-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smartgram

  # ── Express Backend ──
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartgram-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/smartgram
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb

  # ── FastAPI AI Service ──
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartgram-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env

  # ── React Dashboard ──
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: smartgram-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
